# tmux-style prefix. The prefix key itself lives in keys.json ("ctrl-space": "mod.open:prefix").
# Saving this file reloads the mod. Keys: a typed character ("%", "c", "H") or a chord ("ctrl-h").
# Values: any herdr-app command, "name" or "name:value".

[prefix]
color = "ansi11"   # theme color name (ansi0..15, accent, ...) or #rrggbb

[bindings]
'"' = "pane.split:down"
"%" = "pane.split:right"
"/" = "terminal.search"
"P" = "terminal.paste"
"c" = "tab.new"
"n" = "tab.next"
"p" = "tab.prev"
"x" = "pane.close"
"z" = "pane.zoom"
"&" = "tab.close"
"," = "tab.rename"
"$" = "space.rename"
"h" = "pane.go:left"
"j" = "pane.go:down"
"k" = "pane.go:up"
"l" = "pane.go:right"
"1" = "tab.select:1"
"2" = "tab.select:2"
"3" = "tab.select:3"
"4" = "tab.select:4"
"5" = "tab.select:5"
"6" = "tab.select:6"
"7" = "tab.select:7"
"8" = "tab.select:8"
"9" = "tab.select:9"
